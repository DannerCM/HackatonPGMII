<label>Traslación X
  <input
    type="range"
    min="-300"
    max="300"
    [value]="tx"
    (input)="tx = +$any($event.target).value; emitir()"
  />
  {{ tx }}
</label>
<label>Traslación Y
  <input
    type="range"
    min="-220"
    max="220"
    [value]="ty"
    (input)="ty = +$any($event.target).value; emitir()"
  />
  {{ ty }}
</label>
<label>Escala
  <input
    type="range"
    min="0.2"
    max="3"
    step="0.05"
    [value]="scale"
    (input)="scale = +$any($event.target).value; emitir()"
  />
  {{ scale }}
</label>
