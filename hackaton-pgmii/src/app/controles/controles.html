<section class="est3-panel">
  <h3>Est3 - Reflexion + panel de matriz</h3>

  <div class="flip-buttons">
    <button
      type="button"
      class="flip"
      [class.active]="transform.state().flipX"
      (click)="toggleFlipX()"
    >
      Reflejo horizontal
    </button>
    <button
      type="button"
      class="flip"
      [class.active]="transform.state().flipY"
      (click)="toggleFlipY()"
    >
      Reflejo vertical
    </button>
  </div>

  </section>
